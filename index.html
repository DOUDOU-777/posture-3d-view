<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>3D人体模型</title>
  <style>
    body { margin: 0; overflow: hidden; background: #f8f7e4; }
    #tip, #label {
      position: fixed; left: 20px; z-index: 10;
      color: #29413E; font-size: 16px;
      background: rgba(255,255,255,0.9);
      padding: 10px 14px; border-radius: 14px;
      font-weight: bold;
    }
    #tip { top: 20px; }
    #label { bottom: 24px; }
  </style>
</head>

<body>
<div id="tip">正在启动3D程序...</div>
<div id="label">姿态状态：加载中</div>

<script src="./libs/three.min.js"></script>
<script src="./libs/OrbitControls.js"></script>
<script src="./libs/GLTFLoader.js"></script>

<script>
const tip = document.getElementById('tip');
const label = document.getElementById('label');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8f7e4);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.6));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(3, 5, 5);
scene.add(dirLight);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

const params = new URLSearchParams(window.location.search);
const msg = params.get('msg') || 'normal';

const bodyColor = 0x72B09F;
let markerColor = null;
let markerType = '';
let statusText = '正常姿态：未检测到异常部位';

if (msg === 'hunchback') {
  markerColor = 0xff2d2d;
  markerType = 'back';
  statusText = '驼背异常：背部高亮提示';
} else if (msg === 'neck_stain') {
  markerColor = 0xff9900;
  markerType = 'neck';
  statusText = '颈部异常：颈部高亮提示';
}

label.innerText = '姿态状态：' + statusText;

let marker = null;
let halo = null;

function createMarker(parent, position, color) {
  const markerGeo = new THREE.SphereGeometry(0.09, 32, 32);
  const markerMat = new THREE.MeshBasicMaterial({ color });
  marker = new THREE.Mesh(markerGeo, markerMat);
  marker.position.copy(position);
  parent.add(marker);

  const haloGeo = new THREE.SphereGeometry(0.17, 32, 32);
  const haloMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.35
  });
  halo = new THREE.Mesh(haloGeo, haloMat);
  halo.position.copy(position);
  parent.add(halo);

  const light = new THREE.PointLight(color, 2.2, 2);
  light.position.copy(position);
  parent.add(light);
}

const loader = new THREE.GLTFLoader();

loader.load(
  './XBot.glb',

  function(gltf) {
    const model = gltf.scene;

    model.traverse(function(child) {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: bodyColor,
          roughness: 0.5,
          metalness: 0.1
        });
      }
    });

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    model.position.sub(center);
    model.position.y -= 1;
    model.scale.set(3, 3, 3);

    scene.add(model);

    if (markerColor) {
      let markerPos;

      if (markerType === 'neck') {
        markerPos = new THREE.Vector3(
          0,
          size.y * 0.33,
          size.z * 0.30
        );
      }

      if (markerType === 'back') {
        markerPos = new THREE.Vector3(
          0,
          size.y * 0.10,
          size.z * 0.34
        );
      }

      createMarker(model, markerPos, markerColor);
    }

    tip.innerText = '模型加载完成，可拖动旋转';
  },

  function(xhr) {
    if (xhr.total) {
      tip.innerText = '模型加载中：' + Math.round((xhr.loaded / xhr.total) * 100) + '%';
    }
  },

  function(error) {
    console.error(error);
    tip.innerText = '模型加载失败，请检查 XBot.glb';
  }
);

let pulse = 0;

function animate() {
  requestAnimationFrame(animate);

  pulse += 0.05;

  if (marker && halo) {
    const s1 = 1 + Math.sin(pulse) * 0.25;
    marker.scale.set(s1, s1, s1);

    const s2 = 1.3 + Math.sin(pulse) * 0.45;
    halo.scale.set(s2, s2, s2);
    halo.material.opacity = 0.22 + Math.abs(Math.sin(pulse)) * 0.25;
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
