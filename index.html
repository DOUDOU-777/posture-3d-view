<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>3D人体模型</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #f8f7e4;
      font-family: Arial, sans-serif;
    }

    #tip {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 10;
      color: #29413E;
      font-size: 16px;
      background: rgba(255,255,255,0.92);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: bold;
    }

    #label {
      position: fixed;
      left: 20px;
      bottom: 24px;
      z-index: 10;
      color: #29413E;
      font-size: 16px;
      background: rgba(255,255,255,0.92);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: bold;
      max-width: 80%;
      line-height: 1.6;
    }
  </style>
</head>

<body>
<div id="tip">正在启动3D程序...</div>
<div id="label">姿态状态：加载中</div>

<script src="./libs/three.min.js"></script>
<script src="./libs/OrbitControls.js"></script>
<script src="./libs/GLTFLoader.js"></script>

<script>
const tip = document.getElementById('tip');
const label = document.getElementById('label');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8f7e4);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 1.5, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 光照
scene.add(new THREE.AmbientLight(0xffffff, 1.6));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(3, 5, 5);
scene.add(dirLight);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.9, 0);

// 姿态参数
const params = new URLSearchParams(window.location.search);
const msg = params.get('msg') || 'normal';

const bodyColor = 0x72B09F;

// 多个异常点容器
let markers = [];
let halos = [];

// 创建单个异常点
function createSingleMarker(parent, position, color) {
  const markerGeo = new THREE.SphereGeometry(0.13, 36, 36);
  const markerMat = new THREE.MeshBasicMaterial({ color: color });
  const marker = new THREE.Mesh(markerGeo, markerMat);
  marker.position.copy(position);
  parent.add(marker);

  const haloGeo = new THREE.SphereGeometry(0.24, 36, 36);
  const haloMat = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.35
  });
  const halo = new THREE.Mesh(haloGeo, haloMat);
  halo.position.copy(position);
  parent.add(halo);

  const pointLight = new THREE.PointLight(color, 2.2, 2.5);
  pointLight.position.copy(position);
  parent.add(pointLight);

  markers.push(marker);
  halos.push(halo);
}

// 批量创建异常点
function createMarkers(parent, points, color) {
  points.forEach(p => {
    createSingleMarker(
      parent,
      new THREE.Vector3(p.x, p.y, p.z),
      color
    );
  });
}

// 按姿态定义异常点位置
function getMarkerConfig(msg) {
  // 这些坐标是按 XBot 模型局部坐标手动调过的
  // 相比之前已经整体上移很多，并把点做大了
  if (msg === 'head_forward') {
    return {
      color: 0xff9900,
      text: '姿态状态：头前倾\n异常部位：颈部',
      points: [
        { x: 0.00, y: 1.02, z:5 }
      ]
    };
  }

  if (msg === 'hunchback') {
    return {
      color: 0xff2d2d,
      text: '姿态状态：驼背 / 胸椎后凸\n异常部位：胸背部',
      points: [
        { x: 0.00, y: 0.66, z: 4}
      ]
    };
  }

  if (msg === 'uneven_shoulders') {
    return {
      color: 0xff2d2d,
      text: '姿态状态：高低肩\n异常部位：左右肩部',
      points: [
        { x: -4, y: 0.82, z: 3},
        { x:  4, y: 0.70, z: 3 }
      ]
    };
  }

  if (msg === 'lateral_bias') {
    return {
      color: 0xff2d2d,
      text: '姿态状态：左右不对称 / 侧偏趋势\n异常部位：躯干左右不对称点',
      points: [
        { x: -2, y: 0.64, z: 2 },
        { x: 2, y: 0.34, z: 2}
      ]
    };
  }

  return {
    color: 0x72B09F,
    text: '姿态状态：正常姿态\n异常部位：无',
    points: []
  };
}

const loader = new THREE.GLTFLoader();

loader.load(
  './XBot.glb',

  function (gltf) {
    const model = gltf.scene;

    model.traverse(function (child) {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: bodyColor,
          roughness: 0.5,
          metalness: 0.1
        });
      }
    });

    // 模型缩放
    model.scale.set(3, 3, 3);

    // 居中
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    // 稍微往下放一点，让人物居中
    model.position.y -= 1.0;

    scene.add(model);

    // 创建异常点
    const config = getMarkerConfig(msg);
    label.innerText = config.text;

    if (config.points.length > 0) {
      createMarkers(model, config.points, config.color);
    }

    tip.innerText = '模型加载完成，可拖动旋转';
  },

  function (xhr) {
    if (xhr.total) {
      const percent = Math.round((xhr.loaded / xhr.total) * 100);
      tip.innerText = '模型加载中：' + percent + '%';
    } else {
      tip.innerText = '模型正在加载...';
    }
  },

  function (error) {
    console.error(error);
    tip.innerText = '模型加载失败，请检查 XBot.glb';
  }
);

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let pulse = 0;

function animate() {
  requestAnimationFrame(animate);

  pulse += 0.05;

  for (let i = 0; i < markers.length; i++) {
    const marker = markers[i];
    const halo = halos[i];

    const s1 = 1 + Math.sin(pulse + i * 0.4) * 0.22;
    marker.scale.set(s1, s1, s1);

    const s2 = 1.25 + Math.sin(pulse + i * 0.4) * 0.40;
    halo.scale.set(s2, s2, s2);
    halo.material.opacity = 0.20 + Math.abs(Math.sin(pulse + i * 0.4)) * 0.25;
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
